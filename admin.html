<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Nikole's Kake & Cream</title>
    <style>
        :root {
            --color-dorado: #D4AF37;
            --color-cafe: #4A3B32;
            --color-fondo: #FDFBF7;
            --color-crema: #FFF8E8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-cafe);
            margin: 0;
            padding: 0;
        }

        /* Pantalla de bloqueo de seguridad estricta para clientes */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--color-cafe); display: flex;
            justify-content: center; align-items: center; z-index: 99999;
        }
        .auth-box {
            background: white; padding: 2.5rem; border-radius: 12px;
            text-align: center; width: 100%; max-width: 380px;
            border: 2px solid var(--color-dorado); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .auth-box img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--color-dorado); object-fit: cover; margin-bottom: 1rem; }
        .auth-box input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .auth-box label { display: block; text-align: left; font-size: 0.85rem; font-weight: bold; color: var(--color-cafe); }

        /* Pantalla de Intro (2 segundos) */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--color-cafe); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; color: var(--color-dorado); animation: fadeOut 0.5s ease 1.8s forwards;
        }
        #intro-screen img {
            width: 180px; height: 180px; border-radius: 50%;
            border: 3px solid var(--color-dorado); object-fit: cover; margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        /* Barra superior de la dueña autenticada */
        .user-bar {
            background-color: var(--color-dorado); color: white; padding: 0.5rem 1rem;
            text-align: right; font-size: 0.9rem; font-weight: bold; display: flex;
            justify-content: flex-end; align-items: center; gap: 15px;
        }
        .user-bar button {
            background: white; color: var(--color-cafe); border: none; padding: 4px 10px;
            border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
        }

        header {
            background-color: var(--color-cafe); color: var(--color-dorado);
            text-align: center; padding: 2rem; border-bottom: 4px solid var(--color-dorado); position: relative;
        }
        .logo-esquina {
            position: absolute; top: 15px; left: 20px; width: 130px; height: 130px;
            border-radius: 50%; border: 2px solid var(--color-dorado); object-fit: cover;
        }
        header h1 { margin: 0; font-size: 2rem; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        
        .admin-card {
            background: white; padding: 2rem; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(74, 59, 50, 0.1); border: 2px dashed var(--color-dorado); margin-bottom: 2rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        .btn {
            background-color: var(--color-dorado); color: white; border: none;
            padding: 0.75rem 1.5rem; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem;
        }
        .btn:hover { background-color: #B38F27; }

        .product-stats-card {
            background: white; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;
            border: 1px solid #E6DCCD; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 20px; align-items: flex-start;
        }
        .admin-product-img {
            width: 100px; height: 100px; border-radius: 8px; object-fit: cover;
            border: 2px solid var(--color-dorado); flex-shrink: 0; background-color: var(--color-crema);
        }
        .admin-product-info { flex-grow: 1; }
        .stats-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #eee; padding-bottom: 0.8rem; margin-bottom: 0.8rem;
        }
        .stats-badges { display: flex; gap: 15px; font-weight: bold; font-size: 0.95rem; }
        .badge-likes { color: #d9534f; }
        .badge-comments { color: var(--color-cafe); }
        .comment-box {
            background: #faf8f5; padding: 0.5rem 0.8rem; border-radius: 4px;
            margin-top: 5px; font-size: 0.85rem; border-left: 3px solid var(--color-dorado);
        }
        .btn-delete { background-color: #d9534f; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- CAPA DE SEGURIDAD EXCLUSIVA (Bloquea a clientes) -->
    <div id="auth-overlay">
        <div class="auth-box">
            <img src="img/logokikole.png" alt="Logo">
            <h2 id="auth-titulo" style="color: var(--color-cafe); margin-top:0;">Panel Protegido 👑</h2>
            <p id="auth-subtitulo" style="font-size: 0.85rem; color: #666;"></p>
            
            <form id="authForm" onsubmit="procesarAutenticacion(event)">
                <div id="campo-usuario-contenedor">
                    <label>Nombre de Usuario:</label>
                    <input type="text" id="inputUsuario" required placeholder="Ej. Nikole">
                </div>
                <label>Contraseña:</label>
                <input type="password" id="inputClave" required placeholder="Tu contraseña secreta">
                <button type="submit" class="btn" id="btnAuthAccion">Acceder</button>
            </form>
            <a href="../index.html" style="display:block; margin-top:1rem; color:#888; font-size:0.85rem; text-decoration:none;">← Volver a la Tienda</a>
        </div>
    </div>

    <div id="intro-screen">
        <img src="img/logokikole.png" alt="Logo Nikole's Kake & Cream">
        <h2>Nikole's Kake & Cream</h2>
        <p style="font-style: italic; color: #fff;">"Bienvenidos al mundo dulce de Nikole, postres dulces y suaves en cada porción"</p>
    </div>

    <!-- Barra superior con opción de actualizar credenciales de 30 días -->
    <div class="user-bar">
        <span id="labelDueñaActual">Dueña: Administradora</span>
        <button onclick="cambiarCredenciales()" style="background-color: var(--color-cafe); color: white;">Actualizar Credenciales (30 días)</button>
        <button onclick="cerrarSesionDueña()">Cerrar Sesión</button>
    </div>

    <header>
        <img src="img/logokikole.png" alt="Logo" class="logo-esquina">
        <h1>Panel de Control de la Dueña 👑</h1>
        <p>Nikole's Kake & Cream</p>
    </header>

    <div class="container">
        <div class="admin-card">
            <h2>Agregar Nuevo Producto a la Tienda</h2>
            <form id="addProductForm" onsubmit="agregarNuevoProducto(event)">
                <div class="form-group">
                    <label>Nombre del Postre:</label>
                    <input type="text" id="nombreProd" required placeholder="Ej. Cheesecake de Maracuyá">
                </div>
                <div class="form-group">
                    <label>Descripción:</label>
                    <textarea id="descProd" required placeholder="Detalles de ingredientes..."></textarea>
                </div>
                <div class="form-group">
                    <label>Precio ($):</label>
                    <input type="text" id="precioProd" required placeholder="Ej. 2.00">
                </div>
                <div class="form-group">
                    <label>Ruta o Enlace de la Foto (ej. img/nombre.jpeg):</label>
                    <input type="text" id="imgProd" required placeholder="img/foto.jpeg">
                </div>
                <button type="submit" class="btn">Publicar Producto</button>
            </form>
        </div>

        <h2 style="color: var(--color-cafe);">Métricas y Comentarios de los Clientes</h2>
        <div id="adminStatsList"></div>
    </div>

    <script>
        // SEGURIDAD DE 30 DÍAS Y BLOQUEO DE CLIENTES
        window.addEventListener('DOMContentLoaded', () => {
            const cuentaAdminCreada = localStorage.getItem('credencialesAdminNikole');
            const sesionActiva = localStorage.getItem('sesionNikoleActiva');
            const fechaExpiracion = localStorage.getItem('sesionExpiracionNikole');
            const ahora = new Date().getTime();

            // Verificamos si la sesión sigue vigente (menos de 30 días)
            if (sesionActiva && fechaExpiracion && ahora < parseInt(fechaExpiracion)) {
                // Sesión válida: Ocultamos el bloqueo y dejamos entrar a la dueña
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('labelDueñaActual').innerText = `Dueña: ${sesionActiva}`;
            } else {
                // Si expiró o no hay sesión, limpiamos cualquier residuo de sesión vieja
                localStorage.removeItem('sesionNikoleActiva');
                localStorage.removeItem('sesionExpiracionNikole');

                if (!cuentaAdminCreada) {
                    // Primera vez: Registro de la cuenta de la dueña
                    document.getElementById('intro-screen').style.display = 'none';
                    document.getElementById('auth-titulo').innerText = "Crea tu cuenta 👑";
                    document.getElementById('auth-subtitulo').innerText = "Define tu usuario y contraseña de administración (Acceso exclusivo):";
                    document.getElementById('btnAuthAccion').innerText = "Registrar y Entrar";
                } else {
                    // Inicio de sesión normal (Los clientes que entren aquí verán esto y no podrán pasar sin la contraseña)
                    document.getElementById('intro-screen').style.display = 'none';
                    document.getElementById('auth-titulo').innerText = "Panel Protegido 👑";
                    document.getElementById('auth-subtitulo').innerText = "Área exclusiva para la administración. Ingresa tus datos:";
                    document.getElementById('btnAuthAccion').innerText = "Iniciar Sesión";
                }
            }
        });

        function procesarAutenticacion(event) {
            event.preventDefault();
            const usuarioIngresado = document.getElementById('inputUsuario').value.trim();
            const claveIngresada = document.getElementById('inputClave').value.trim();
            
            const cuentaGuardada = JSON.parse(localStorage.getItem('credencialesAdminNikole'));
            const treintaDiasEnMilisegundos = 30 * 24 * 60 * 60 * 1000; // 30 días exactos
            const tiempoExpiracion = new Date().getTime() + treintaDiasEnMilisegundos;

            if (!cuentaGuardada) {
                // REGISTRO INICIAL
                const nuevaCuenta = { usuario: usuarioIngresado, clave: claveIngresada };
                localStorage.setItem('credencialesAdminNikole', JSON.stringify(nuevaCuenta));
                localStorage.setItem('sesionNikoleActiva', usuarioIngresado);
                localStorage.setItem('sesionExpiracionNikole', tiempoExpiracion);
                
                alert("¡Cuenta de administración creada con éxito! Tu acceso estará activo por 30 días.");
                location.reload();
            } else {
                // VALIDACIÓN DE ACCESO (Evita que clientes entren)
                if (usuarioIngresado === cuentaGuardada.usuario && claveIngresada === cuentaGuardada.clave) {
                    localStorage.setItem('sesionNikoleActiva', usuarioIngresado);
                    localStorage.setItem('sesionExpiracionNikole', tiempoExpiracion);
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('labelDueñaActual').innerText = `Dueña: ${usuarioIngresado}`;
                } else {
                    alert("❌ Acceso denegado. Usuario o contraseña incorrectos.");
                }
            }
        }

        // Función para que la dueña pueda actualizar/cambiar su usuario y contraseña cuando pasen los 30 días o cuando guste
        function cambiarCredenciales() {
            const claveActualVerificacion = prompt("Para actualizar tus credenciales, introduce tu contraseña actual:");
            const cuentaGuardada = JSON.parse(localStorage.getItem('credencialesAdminNikole'));

            if (cuentaGuardada && claveActualVerificacion === cuentaGuardada.clave) {
                const nuevoUsuario = prompt("Introduce tu nuevo nombre de usuario:", cuentaGuardada.usuario);
                const nuevaClave = prompt("Introduce tu nueva contraseña secreta:");

                if (nuevoUsuario && nuevaClave) {
                    const cuentaActualizada = { usuario: nuevoUsuario.trim(), clave: nuevaClave.trim() };
                    localStorage.setItem('credencialesAdminNikole', JSON.stringify(cuentaActualizada));
                    
                    // Extiende la vigencia 30 días más con los nuevos datos
                    const treintaDiasEnMilisegundos = 30 * 24 * 60 * 60 * 1000;
                    localStorage.setItem('sesionExpiracionNikole', new Date().getTime() + treintaDiasEnMilisegundos);
                    
                    alert("✅ ¡Credenciales actualizadas con éxito! Tu sesión se ha renovado por 30 días más.");
                    location.reload();
                } else {
                    alert("Operación cancelada. Los campos no pueden estar vacíos.");
                }
            } else {
                alert("❌ Contraseña incorrecta. No se pudo realizar el cambio.");
            }
        }

        function cerrarSesionDueña() {
            localStorage.removeItem('sesionNikoleActiva');
            localStorage.removeItem('sesionExpiracionNikole');
            alert("Has cerrado sesión del panel de forma segura.");
            // Esto recarga el archivo actual limpiando cualquier error de ruta
            window.location.href = "admin.html"; 
        }

        let productos = JSON.parse(localStorage.getItem('productosNikole')) || [
            { id: 1, nombre: "Clásico Rojo Fresas", desc: "Suave crema de queso sobre base crujiente y mermelada de fresas.", precio: "2.00", img: "img/fresas.jpeg", likes: 0, comentarios: [] },
            { id: 2, nombre: "Maracuyá Passion", desc: "El balance perfecto entre la acidez de la fruta y la dulzura de la crema.", precio: "2.00", img: "img/maracuya.jpeg", likes: 0, comentarios: [] },
            { id: 3, nombre: "Limon Fiesta", desc: "Una delicia entre la dulce crema y el toque de limón para alegrar tus días.", precio: "2.00", img: "img/limon.jpeg", likes: 0, comentarios: [] },
            $
            { id: 4, nombre: "Mora Lover", desc: "Amor en cada paladar de la dulce mora junto con la dulce crema.", precio: "2.00", img: "img/mora.jpeg", likes: 0, comentarios: [] }
        ];

        function sincronizar() {
            localStorage.setItem('productosNikole', JSON.stringify(productos));
            renderizarPanelAdmin();
        }

        function renderizarPanelAdmin() {
            const container = document.getElementById('adminStatsList');
            container.innerHTML = '';

            if (productos.length === 0) {
                container.innerHTML = '<p>No hay productos activos en este momento.</p>';
                return;
            }

            productos.forEach((p, index) => {
                let comentariosHTML = '';
                if (p.comentarios && p.comentarios.length > 0) {
                    p.comentarios.forEach(c => {
                        let usuarioComentario = c.usuario ? `<strong>${c.usuario}:</strong>` : '<strong>Cliente:</strong>';
                        let textoComentario = c.texto ? c.texto : c;
                        comentariosHTML += `<div class="comment-box">💬 ${usuarioComentario} "${textoComentario}"</div>`;
                    });
                } else {
                    comentariosHTML = `<div style="color: #888; font-size: 0.85rem; margin-top: 5px;">Aún no hay comentarios de este producto.</div>`;
                }

                container.innerHTML += `
                    <div class="product-stats-card">
                        <img src="${p.img}" alt="${p.nombre}" class="admin-product-img" onerror="this.src='img/logokikole.png'">
                        
                        <div class="admin-product-info">
                            <div class="stats-header">
                                <div>
                                    <strong style="font-size: 1.1rem; color: var(--color-cafe);">${p.nombre}</strong> - <span style="color: var(--color-dorado); font-weight:bold;">$${p.precio}</span><br>
                                    <small style="color: #666;">${p.desc}</small>
                                </div>
                                <button class="btn-delete" onclick="eliminarProducto(${index})">Eliminar Producto</button>
                            </div>
                            
                            <div class="stats-badges">
                                <span class="badge-likes">❤️ ${p.likes || 0} Me gusta</span>
                                <span class="badge-comments">💬 ${p.comentarios ? p.comentarios.length : 0} Comentarios</span>
                            </div>

                            <div style="margin-top: 10px;">
                                <strong>Comentarios y peticiones de clientes:</strong>
                                ${comentariosHTML}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function agregarNuevoProducto(event) {
            event.preventDefault();
            const nuevo = {
                id: Date.now(),
                nombre: document.getElementById('nombreProd').value,
                desc: document.getElementById('descProd').value,
                precio: document.getElementById('precioProd'].value,
                img: document.getElementById('imgProd').value,
                likes: 0,
                comentarios: []
            };

            productos.push(nuevo);
            sincronizar();
            document.getElementById('addProductForm').reset();
            alert('¡Nuevo cheesecake agregado y publicado en la tienda de los clientes!');
        }

        function eliminarProducto(index) {
            if (confirm('¿Estás segura de eliminar este cheesecake? Se borrará de la tienda de los clientes.')) {
                productos.splice(index, 1);
                sincronizar();
            }
        }

        renderizarPanelAdmin();
    </script>
</body>
</html>
